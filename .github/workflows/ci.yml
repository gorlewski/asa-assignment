name: CI

on:
  push:
    branches: ["**"]
  pull_request:
    branches: ["**"]

# Least-privilege token by default; individual jobs opt in if they need more.
permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up Python 3.11
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install dependencies
        run: pip install -r requirements.txt

      - name: Run tests
        run: pytest tests/ -v

  test-notify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up Node.js 20
        uses: actions/setup-node@v4
        with:
          node-version: "20"

      - name: Install dependencies
        run: npm install
        working-directory: notify

      - name: Run tests
        run: npm test
        working-directory: notify

  # ---------------------------------------------------------------------------
  # Security scanning. Tooling: Semgrep (SAST), Trivy (SCA/container/IaC),
  # Gitleaks (secrets, second opinion). Rationale is documented in
  # docs/findings.md. Each job uploads its raw JSON report as an artifact.
  #
  # Enforcement note: the SAST and secret gates are report-only for now
  # (continue-on-error) because the starter code still contains the JWT
  # 'none' bypass, the SQL injection and the hardcoded secrets. Those are
  # remediated in Task 3; the corresponding gates are made hard (blocking)
  # in that task. SCA/container/IaC gates are already hard and green.
  # ---------------------------------------------------------------------------

  sast:
    name: SAST (Semgrep)
    runs-on: ubuntu-latest
    container:
      image: semgrep/semgrep:1.175.0
    steps:
      - uses: actions/checkout@v4

      - name: Semgrep scan (JSON report)
        run: semgrep --config auto --json --output sast.semgrep.json app/ notify/

      - name: Upload SAST report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: sast.semgrep.json
          path: sast.semgrep.json

      # Report-only until Task 3 fixes the starter ERROR-level findings.
      # TODO(Task 3): remove continue-on-error to make this a hard gate.
      - name: Fail on ERROR-severity findings (report-only)
        continue-on-error: true
        run: semgrep --config auto --error --severity ERROR app/ notify/

  sca:
    name: SCA (Trivy)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      # Run Trivy via its official image for deterministic behaviour (avoids the
      # action's binary installer, which can hit GitHub rate limits on runners).
      - name: Trivy dependency scan (JSON report)
        run: |
          docker run --rm -v "$PWD:/src" -w /src aquasec/trivy:0.65.0 \
            fs --scanners vuln --format json --output sca.trivy.json .

      - name: Upload SCA report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: sca.trivy.json
          path: sca.trivy.json

      - name: Fail on CRITICAL dependency CVEs
        run: |
          docker run --rm -v "$PWD:/src" -w /src aquasec/trivy:0.65.0 \
            fs --scanners vuln --severity CRITICAL --ignore-unfixed --exit-code 1 .

  container-scan:
    name: Container image scan (Trivy)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Build image
        run: docker build -t vulntracker-api:ci .

      - name: Trivy image scan (JSON report)
        run: |
          docker run --rm -v /var/run/docker.sock:/var/run/docker.sock \
            -v "$PWD:/src" -w /src aquasec/trivy:0.65.0 \
            image --scanners vuln,secret,misconfig --format json \
            --output container.trivy.json vulntracker-api:ci

      - name: Upload container report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: container.trivy.json
          path: container.trivy.json

      - name: Fail on CRITICAL (fixable) library CVEs in our layers
        run: |
          docker run --rm -v /var/run/docker.sock:/var/run/docker.sock \
            aquasec/trivy:0.65.0 \
            image --scanners vuln --pkg-types library --severity CRITICAL \
            --ignore-unfixed --exit-code 1 vulntracker-api:ci

  iac-scan:
    name: IaC scan (Trivy)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Trivy IaC/config scan (JSON report)
        run: |
          docker run --rm -v "$PWD:/src" -w /src aquasec/trivy:0.65.0 \
            config --format json --output iac.trivy.json helm/

      - name: Upload IaC report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: iac.trivy.json
          path: iac.trivy.json

      - name: Fail on HIGH/CRITICAL misconfigurations
        run: |
          docker run --rm -v "$PWD:/src" -w /src aquasec/trivy:0.65.0 \
            config --severity HIGH,CRITICAL --exit-code 1 helm/

  secrets:
    name: Secret scan (Gitleaks)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      # Report-only until Task 3 removes the hardcoded starter secrets.
      # TODO(Task 3): remove continue-on-error to make this a hard gate.
      - name: Gitleaks scan (report-only)
        continue-on-error: true
        run: |
          docker run --rm -v "$PWD:/repo" zricethezav/gitleaks:latest \
            dir /repo --config /repo/.gitleaks.toml \
            --report-format json --report-path /repo/secrets.gitleaks.json \
            --exit-code 1

      - name: Upload secrets report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: secrets.gitleaks.json
          path: secrets.gitleaks.json
